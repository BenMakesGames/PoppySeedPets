<div class="dialog">
  <h4>★Kindred</h4>
  <div class="dialog-body">
    <markdown [data]="result.text" />
    <ul class="progress">
      @for(p of result.progress; track p.characterId)
      {
        <li>
          <a [routerLink]="[ '/starKindred/character', p.characterId ]" (click)="doOk()">{{ p.characterName }}</a> ({{ p.petName }})
          @if(p.retired)
          {
            retired, at level {{ p.level }}!
          }
          @else
          {
            gained {{ p.experienceGained }} XP.
            @if(p.levelsGained > 0)
            {
              <b>Level up! Now level {{ p.level }}!</b>
            }
          }
        </li>
      }
    </ul>
    <div class="buttons centered">
      <button type="button" (click)="doOk()">OK</button>
    </div>
  </div>
</div>
